# ============================================================
#  使用： docker compose -f docker-compose-build.yaml up -d
# ============================================================

services:
  go-proxy:
    container_name: reg-go-proxy
    build:
      context: ./go-proxy
      dockerfile: Dockerfile
    restart: always
    environment:
      - OTEL_TRACES_EXPORTER=none
      - GO_PROXY_ADMIN_TOKEN=${GO_PROXY_ADMIN_TOKEN:-change-me-to-a-strong-random-token}
      # 如需通过本地代理访问上游，可设置：
      # - HTTP_PROXY=http://host:port
      # - HTTPS_PROXY=http://host:port
    volumes:
      # 配置持久化：宿主机目录挂载，容器内配置在 /app/config.d/config.yaml
      - ./config/go-proxy:/app/config.d
    ports:
      - 50000:5000
    networks:
      - registry-net

  hubcmd-ui:
    container_name: hubcmd-ui
    build:
      context: ./hubcmdui
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - go-proxy
    environment:
      # 指向 go-proxy 的管理端口
      - GO_PROXY_ADMIN_URL=http://go-proxy:5001
      - GO_PROXY_ADMIN_TOKEN=${GO_PROXY_ADMIN_TOKEN:-change-me-to-a-strong-random-token}
      # 真实宿主机名
      - HOST_NAME=${HOST_NAME:-}
      - SECURE_COOKIE=false
      # HTTP 代理配置：前台镜像搜索由 hubcmd-ui 直接访问 Docker Hub/GitHub/Quay 等 API，
      # 受限网络中必须把代理环境变量传给 hubcmd-ui。HTTPS_PROXY 也通常填写 http:// 代理地址
      # （HTTP CONNECT），不要误写成 https://，除非代理端口本身启用了 TLS。
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      # Docker 内部服务名必须绕过出口代理，否则 hubcmd-ui 访问 go-proxy 管理端口可能被误转发。
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1,go-proxy,reg-go-proxy,hubcmd-ui,.local}
      # Registry 标签详情性能参数；留空时使用应用默认值。
      - REGISTRY_TAG_CACHE_TTL_MS=${REGISTRY_TAG_CACHE_TTL_MS:-}
      - REGISTRY_TAG_METADATA_CONCURRENCY=${REGISTRY_TAG_METADATA_CONCURRENCY:-}
      - REGISTRY_TAGS_MAX=${REGISTRY_TAGS_MAX:-}
      # 防止搜索/标签请求产生无限增长的内存缓存。
      - REGISTRY_CACHE_MAX_ENTRIES=${REGISTRY_CACHE_MAX_ENTRIES:-}
      - REGISTRY_TOKEN_CACHE_MAX_ENTRIES=${REGISTRY_TOKEN_CACHE_MAX_ENTRIES:-}
      - REGISTRY_CACHE_CLEANUP_INTERVAL_MS=${REGISTRY_CACHE_CLEANUP_INTERVAL_MS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # SQLite 数据库文件
      - ./hubcmdui/data:/app/data
    ports:
      - 30080:3000
    networks:
      - registry-net

networks:
  registry-net:
